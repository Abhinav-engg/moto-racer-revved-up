<!doctype html>
<html lang="en">
  <head>
    <meta
      charset="UTF-8"
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moto Racer-Revved Up</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
  </head>
  <body>
    <div id="start-screen" class="screen">
      <h1>MOTO RACER</h1>
      <button id="start-button">START GAME</button>
    </div>

    <div id="track-screen" class="screen hidden">
      <h1>PICK YOUR TRACK</h1>
      <div class="track-buttons">
        <button class="track-button" id="classic-button">
          <img src="assets/buttons/classic.png" alt="Classic Track">
        </button>
        <button class="track-button" id="snowy-button">
          <img src="assets/buttons/snowybutton.png" alt="Snowy Track">
        </button>
      </div>
    </div>

    <div id="game-over-screen" class="screen hidden">

    <h1>GAME OVER</h1>

    <button id="restart-button">RESTART</button>

</div>

    <div class="game hidden">
    <h1 class="title">Moto Racer Revved Up</h1>
    <div class="arena">
      <div class="hud">
        <div class="card">
          <span class="label">LAP</span>
          <span class="value" id="lap">00/03</span>
        </div>
        <div class="card">
          <span class="label">TIME</span>
          <span class="value" id="timer">05:00</span>
        </div>
      </div>

      <div class="nitro-bar">
        <div class="nitro-fill" id="nitro-fill"></div>
      </div>

      <div class="lives" id="lives">
        <span class="heart">❤️</span>
        <span class="heart">❤️</span>
        <span class="heart">❤️</span>
      </div>

        <div class="coins">
          <span class="coin-icon">🪙</span>
          <span class="value" id="coins">0</span>
        </div>
<div class="instruction-text">
    W to Accelerate | S to Brake | A/D to Steer | SPACE for Nitro
</div>

        <div id="race-complete" class="race-complete hidden">
          <div class="modal-card">
            <h2 class="modal-title">RACE COMPLETED</h2>
            <div class="stats-container">
              <div class="stat-row">
                <span class="stat-label">Coins Collected</span>
                <span class="stat-value" id="final-coins">0</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Lives Remaining</span>
                <span class="stat-value" id="final-lives">3</span>
              </div>
              <div class="stat-row score-row">
                <span class="stat-label">SCORE</span>
                <span class="stat-value score-val" id="final-score">0</span>
              </div>
            </div>
            <button type="button" class="restart-btn" id="restart-btn">PLAY AGAIN</button>
          </div>
        </div>

        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
