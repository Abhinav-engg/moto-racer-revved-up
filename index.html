<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moto Racer-Revved Up</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="start-screen" class="screen">
    <button id="start-button">START GAME</button>
  </div>

  <!-- <div id="mode-screen" class="screen hidden">
      <h1>PICK YOUR MODE</h1>
      <div class="mode-buttons">
        <button class="mode-button" id="normal-button">
          <img src="assets/buttons/timedModebutton.png" alt="Normal Mode">
        </button>
        <button class="mode-button" id="endless-button">
          <img src="assets/buttons/endlessModebutton.png" alt="Endless Mode">
        </button>
      </div> -->

  <div id="track-screen" class="screen hidden">
    <h1>PICK YOUR TRACK</h1>
    <div class="track-buttons">

      <button class="track-button" id="classic-button">
        <img src="assets/elements/classic-mode.png" alt="Classic Track">
        <h2>Classic Track</h2>
      </button>

      <button class="track-button" id="snowy-button">
        <img src="assets/elements/snowy-mode.png" alt="Snowy Track">
        <h2>Snowy Track</h2>
      </button>
    </div>
  </div>

  <div id="game-over-screen" class="screen hidden">
    <h1>GAME OVER</h1>

    <button id="restart-button">RESTART</button>

  </div>

  <div class="game hidden">
    <div class="arena">
      <div class="hud">
        <div class="card">
          <span class="label">LAP</span>
          <span class="value" id="lap">00/03</span>
        </div>
        <div class="card">
          <span class="label">TIME</span>
          <span class="value" id="timer">05:00</span>
        </div>
      </div>

      <div class="nitro-bar">
        <div class="nitro-fill" id="nitro-fill"></div>
      </div>

      <div class="lives" id="lives">
        <span class="heart">❤️</span>
        <span class="heart">❤️</span>
        <span class="heart">❤️</span>
      </div>

      <div class="coins">
        <span class="coin-icon">🪙</span>
        <span class="value" id="coins">0</span>
      </div>
      <div class="instruction-text">
        W to Accelerate | S to Brake | A/D to Steer | SPACE for Nitro
      </div>

      <div class="btns">
        <button id="back">
          <img src="assets/buttons/back.png" alt="Back">
        </button>
        <button id="mute">
          <img src="assets/buttons/mute.png" alt="Mute">
        </button>
        
         <button id="music-off">
          <img src="assets/buttons/music-off.png" alt="Back">
        </button>
      </div>

      <div id="race-complete" class="race-complete hidden">
        <div class="modal-card">
          <h2 class="modal-title">RACE COMPLETED</h2>
          <div class="stats-container">
            <div class="stat-row">
              <span class="stat-label">Coins Collected</span>
              <span class="stat-value" id="final-coins">0</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Lives Remaining</span>
              <span class="stat-value" id="final-lives">3</span>
            </div>
            <div class="stat-row score-row">
              <span class="stat-label">SCORE</span>
              <span class="stat-value score-val" id="final-score">0</span>
            </div>
          </div>
          <button type="button" class="restart-btn" id="restart-btn">PLAY AGAIN</button>
        </div>
      </div>
      <canvas id="canvas"></canvas>
    </div>
  </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
